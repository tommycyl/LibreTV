<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>隐私政策 - LibreTV</title>
	<script src="libs/tailwindcss.min.js"></script>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="manifest" href="manifest.json">
</head>
<body class="page-bg text-white">
	<div class="container mx-auto px-4 py-8">
		<header class="text-center mb-8">
			<h1 class="text-5xl font-bold gradient-text">隐私政策</h1>
		</header>
		<main class="text-center">
			<p class="text-gray-300 mb-4">
				本平台提供在线视频搜索与播放服务，搜索结果和视频内容由第三方接口提供。搜索历史与观看记录保存在您当前浏览器中。
			</p>
			<p class="text-gray-300">
				站点配置统计接口后，进入首页和提交搜索时，会向站点运营方配置的后端发送事件类型、搜索关键词（仅搜索事件）、事件时间和页面路径。首页访问事件还会包含浏览器标识、平台、语言、时区、屏幕尺寸、设备像素比和窗口尺寸。接收后端可从请求中获取访客 IP 地址，用于访问与搜索统计；未配置统计接口时不会发送这些埋点请求。
			</p>
		</main>
		<footer class="mt-12 text-center">
			<div class="flex justify-center space-x-4">
				<a href="/" class="text-gray-400 hover:text-white transition-colors">回到首页</a>
				<a href="https://www.msf.hk/zh-hant/donate/general?type=one-off" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300 transition-colors">捐赠</a>
			</div>
		</footer>
	</div>
</body>
</html>
